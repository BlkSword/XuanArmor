[package]
name = "xuanarmor"
version = "0.5.2"
edition = "2021"
license = "Apache-2.0"
description = "eBPF/XDP host-level CC defense shield - userspace control plane"

[features]
default = []

[dependencies]
aya = { workspace = true, features = ["async_tokio"] }
aya-log = { workspace = true }
xuanarmor-common = { path = "../xuanarmor-common", features = ["userspace"] }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["macros", "formatting"] }
async-trait = "0.1"
redb = "1.5"
csv = "1.3"
subtle = "2"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# 控制台 SPA 内嵌后约 1.26MB，启动时一次性 gzip 缓存，按 Accept-Encoding 协商下发
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "XuanArmor Maintainers <maintainers@xuanarmor.io>"
copyright = "2026 XuanArmor Contributors"
extended-description = "eBPF/XDP host-level CC defense shield"
section = "net"
priority = "optional"
assets = [
    ["target/x86_64-unknown-linux-musl/release/xuanarmor", "usr/local/bin/xuanarmor", "755"],
    ["packaging/config.example.toml", "etc/xuanarmor/config.toml", "640"],
    ["packaging/xuanarmor.service", "lib/systemd/system/xuanarmor.service", "644"],
]
maintainer-scripts = "packaging/debian/"
depends = "$auto"

[package.metadata.rpm]
package = "xuanarmor"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
xuanarmor = { path = "/usr/local/bin/xuanarmor" }

[package.metadata.rpm.files]
"packaging/config.example.toml" = { path = "/etc/xuanarmor/config.toml", mode = "640" }
"packaging/xuanarmor.service" = { path = "/usr/lib/systemd/system/xuanarmor.service", mode = "644" }
