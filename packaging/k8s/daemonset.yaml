apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xuanarmor
  namespace: xuanarmor
  labels:
    app: xuanarmor
spec:
  selector:
    matchLabels:
      app: xuanarmor
  template:
    metadata:
      labels:
        app: xuanarmor
    spec:
      hostNetwork: true
      hostPID: false
      containers:
        - name: xuanarmor
          image: ghcr.io/xuanarmor/xuanarmor:v0.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - NET_RAW
                - PERFMON
                - IPC_LOCK
          volumeMounts:
            - name: config
              mountPath: /etc/xuanarmor
              readOnly: true
            - name: rules
              mountPath: /var/lib/xuanarmor
            - name: logs
              mountPath: /var/log/xuanarmor
          ports:
            - containerPort: 8443
              hostPort: 8443
      volumes:
        - name: config
          configMap:
            name: xuanarmor-config
        - name: rules
          hostPath:
            path: /var/lib/xuanarmor
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /var/log/xuanarmor
            type: DirectoryOrCreate
