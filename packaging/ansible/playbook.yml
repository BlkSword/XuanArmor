---
- name: Deploy XuanArmor
  hosts: xuanarmor_nodes
  become: true
  vars:
    xuanarmor_version: "0.1.2"
    xuanarmor_interface: "eth0"
    xuanarmor_web_port: 8443
  tasks:
    - name: Ensure dependencies are installed
      ansible.builtin.package:
        name:
          - curl
          - ca-certificates
        state: present

    - name: Download XuanArmor release binary
      ansible.builtin.get_url:
        url: "https://github.com/xuanarmor/xuanarmor/releases/download/v{{ xuanarmor_version }}/xuanarmor-x86_64-unknown-linux-musl"
        dest: /usr/local/bin/xuanarmor
        mode: "0755"
        owner: root
        group: root

    - name: Create config directory
      ansible.builtin.file:
        path: /etc/xuanarmor
        state: directory
        mode: "0755"

    - name: Deploy config file
      ansible.builtin.template:
        src: config.toml.j2
        dest: /etc/xuanarmor/config.toml
        mode: "0640"
      notify: Reload XuanArmor

    - name: Deploy systemd service
      ansible.builtin.template:
        src: xuanarmor.service.j2
        dest: /lib/systemd/system/xuanarmor.service
        mode: "0644"
      notify: Reload systemd

    - name: Ensure state directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/lib/xuanarmor
        - /var/log/xuanarmor

    - name: Enable and start XuanArmor
      ansible.builtin.systemd:
        name: xuanarmor
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload XuanArmor
      ansible.builtin.systemd:
        name: xuanarmor
        state: reloaded
